<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hard Chess Online</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px 0 5px;
    }

    #info {
      margin: 10px;
      font-size: 18px;
    }

    #room {
      padding: 10px;
      width: 180px;
      border-radius: 6px;
      border: none;
      font-size: 16px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    #joinBtn {
      background: #22c55e;
      color: white;
    }

    #resetBtn {
      background: #ef4444;
      color: white;
    }

    #board {
      width: min(90vw, 520px);
      height: min(90vw, 520px);
      margin: 20px auto;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 4px solid #374151;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(28px, 8vw, 58px);
      user-select: none;
      cursor: pointer;
    }

    .light {
      background: #f0d9b5;
    }

    .dark {
      background: #b58863;
    }

    .selected {
      outline: 4px solid #22c55e;
      outline-offset: -4px;
    }

    #message {
      min-height: 25px;
      color: #facc15;
    }
  </style>
</head>

<body>

  <h1>♟ Hard Chess Online ♟</h1>

  <div>
    <input id="room" placeholder="Room Code">
    <button id="joinBtn">Join Room</button>
    <button id="resetBtn">Reset</button>
  </div>

  <div id="info">Not connected</div>
  <div id="message"></div>

  <div id="board"></div>

  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const board = document.getElementById("board");
    const roomInput = document.getElementById("room");
    const info = document.getElementById("info");
    const message = document.getElementById("message");

    let myColor = null;
    let selected = null;
    let currentFen = null;

    const pieces = {
      K: "♔",
      Q: "♕",
      R: "♖",
      B: "♗",
      N: "♘",
      P: "♙",

      k: "♚",
      q: "♛",
      r: "♜",
      b: "♝",
      n: "♞",
      p: "♟"
    };

    document.getElementById("joinBtn").onclick = () => {
      const room = roomInput.value.trim();

      if (!room) {
        message.textContent = "Room code enter karo.";
        return;
      }

      socket.emit("join", { room });
    };

    document.getElementById("resetBtn").onclick = () => {
      socket.emit("reset");
    };

    socket.on("joined", data => {
      myColor = data.color;

      info.textContent =
        "Room: " + data.room +
        " | You are: " +
        (myColor === "w" ? "White" : "Black");

      message.textContent = "Game joined!";
    });

    socket.on("errorMsg", msg => {
      message.textContent = msg;
    });

    socket.on("state", state => {
      currentFen = state.fen;

      renderBoard(state.fen);

      if (state.over) {
        info.textContent = state.result || "Game Over";
      } else {
        info.textContent =
          "Turn: " +
          (state.turn === "w" ? "White" : "Black") +
          " | Players: " +
          state.players;
      }
    });

    function renderBoard(fen) {
      board.innerHTML = "";

      const position = fen.split(" ")[0];
      const rows = position.split("/");

      let squares = [];

      for (let row = 0; row < 8; row++) {
        let col = 0;

        for (const char of rows[row]) {

          if (!isNaN(char)) {
            const empty = Number(char);

            for (let i = 0; i < empty; i++) {
              squares.push({
                row: row,
                col: col,
                piece: null
              });

              col++;
            }

          } else {
            squares.push({
              row: row,
              col: col,
              piece: char
            });

            col++;
          }
        }
      }

      // Black player ke liye board ulta
      if (myColor === "b") {
        squares.reverse();
      }

      squares.forEach(square => {

        const div = document.createElement("div");

        const actualRow = square.row;
        const actualCol = square.col;

        div.classList.add("square");

        if ((actualRow + actualCol) % 2 === 0) {
          div.classList.add("light");
        } else {
          div.classList.add("dark");
        }

        const file = String.fromCharCode(97 + actualCol);
        const rank = 8 - actualRow;
        const squareName = file + rank;

        div.dataset.square = squareName;

        if (selected === squareName) {
          div.classList.add("selected");
        }

        if (square.piece) {
          div.textContent = pieces[square.piece];
        }

        div.onclick = () => handleSquare(squareName);

        board.appendChild(div);
      });
    }

    function handleSquare(square) {

      if (!myColor) {
        message.textContent = "Pehle room join karo.";
        return;
      }

      if (!selected) {
        selected = square;
        renderBoard(currentFen);
        return;
      }

      if (selected === square) {
        selected = null;
        renderBoard(currentFen);
        return;
      }

      socket.emit("move", {
        from: selected,
        to: square,
        promotion: "q"
      });

      selected = null;
      renderBoard(currentFen);
    }

    socket.on("connect", () => {
      message.textContent = "Connected to server.";
    });

    socket.on("disconnect", () => {
      message.textContent = "Server disconnected.";
    });
  </script>

</body>
</html>
