<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hard Chess Online</title><style>body{font-family:Arial;margin:0;background:#111827;color:white;text-align:center}.wrap{max-width:560px;margin:auto;padding:20px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;border:5px solid #374151;border-radius:10px;overflow:hidden}.sq{display:flex;align-items:center;justify-content:center;font-size:clamp(30px,8vw,55px);cursor:pointer;position:relative}.l{background:#f0d9b5}.d{background:#b58863}.sel{outline:4px solid #22c55e;outline-offset:-4px}.dot:after{content:'';width:20%;height:20%;border-radius:50%;background:#22c55e99;position:absolute}input,button{padding:12px;margin:5px;border-radius:8px;border:0;font-size:16px}button{background:#22c55e;font-weight:bold}.muted{color:#9ca3af}</style></head><body><div class="wrap"><h1>♟ Hard Chess</h1><div><input id="room" placeholder="Room code" maxlength="12"><button id="join">Join / Create</button></div><p id="status" class="muted">Create a room and share its code.</p><div id="board" class="board"></div><button id="reset">New Game</button></div><script src="/socket.io/socket.io.js"></script><script>
const S=io(), icons={w:{k:'♔',q:'♕',r:'♖',b:'♗',n:'♘',p:'♙'},b:{k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'}};let fen='startpos',my='?',sel=null,room='';
function parse(f){if(f==='startpos')return [['br','bn','bb','bq','bk','bb','bn','br'],['bp','bp','bp','bp','bp','bp','bp','bp'],...Array(4).fill(0).map(()=>Array(8).fill(null)),['wp','wp','wp','wp','wp','wp','wp','wp'],['wr','wn','wb','wq','wk','wb','wn','wr']];let rows=f.split(' ')[0].split('/');return rows.map(x=>{let a=[];for(const ch of x){if(/\d/.test(ch))for(let i=0;i<+ch;i++)a.push(null);else a.push((ch===ch.toUpperCase()?'w':'b')+ch.toLowerCase())}return a})}
function render(){let b=parse(fen),e=document.getElementById('board');e.innerHTML='';for(let r=0;r<8;r++)for(let c=0;c<8;c++){let q=document.createElement('div');q.className='sq '+((r+c)%2?'d':'l');let p=b[r][c];if(p)q.textContent=icons[p[0]][p[1]];if(sel&&sel[0]===r&&sel[1]===c)q.classList.add('sel');q.onclick=()=>tap(r,c,b);e.appendChild(q)}}
function tap(r,c,b){if(my==='?')return;let p=b[r][c],turn=fen==='startpos'?'w':fen.split(' ')[1];if(sel){let [sr,sc]=sel;let files='abcdefgh';let from=files[sc]+(8-sr),to=files[c]+(8-r);S.emit('move',{from,to});sel=null;render();return}if(p&&p[0]===my&&turn===my){sel=[r,c];render()}}
S.on('joined',x=>{my=x.color;room=x.room;document.getElementById('status').textContent='Room '+room+' • You are '+(my==='w'?'White':'Black');render()});S.on('state',x=>{fen=x.fen;let msg=x.over?(x.result||'Game over'):(x.players<2?'Waiting for opponent…':(x.turn==='w'?'White':'Black')+' to move');document.getElementById('status').textContent=msg;render()});S.on('errorMsg',x=>alert(x));document.getElementById('join').onclick=()=>{room=document.getElementById('room').value;S.emit('join',{room})};document.getElementById('reset').onclick=()=>S.emit('reset');render();
</script></body></html>
